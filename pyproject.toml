[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gotopoguard"
version = "0.2.0"
description = "GoTopoGuard topology monitoring and PRICAI 2026 analysis artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yixi Chen" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Repository = "https://github.com/chengxi271-commits/GoTopoGuard"
Issues = "https://github.com/chengxi271-commits/GoTopoGuard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
reproduce = ["numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.7.2", "joblib==1.5.2", "threadpoolctl==3.6.0"]
