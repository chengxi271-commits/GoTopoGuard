name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/minimal_features.py
      - run: python -m gotopoguard examples/board.json
      - name: Check installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -c "import gotopoguard; assert gotopoguard.__version__ == '0.1.0'"
